<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orco Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        .border-top {
            width: 100%;
            height: 35px;
            background-color: #1a1a1a;
            flex-shrink: 0;
            z-index: 10;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: calc(100% - 35px);
        }

        .border-left {
            width: 35px;
            height: 100%;
            background-color: #1a1a1a;
            flex-shrink: 0;
            z-index: 10;
        }

        .webview {
            flex: 1;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="border-top"></div>
        <div class="main-container">
            <div class="border-left"></div>
            <iframe class="webview" src="https://orco-stream.vercel.app" 
                    allow="fullscreen" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>
</body>
</html>
