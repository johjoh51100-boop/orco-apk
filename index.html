<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orco Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* BORDURE HAUTE - 35px */
        .border-top {
            width: 100%;
            height: 35px;
            background-color: #1a1a1a;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Conteneur principal - le site prend toute la largeur */
        .main-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 70px); /* 35px haut + 35px bas */
            overflow: hidden;
        }

        /* BORDURE BASSE - 35px */
        .border-bottom {
            width: 100%;
            height: 35px;
            background-color: #1a1a1a;
            flex-shrink: 0;
            z-index: 10;
        }

        .webview {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- Bordure haute -->
        <div class="border-top"></div>

        <!-- Site en pleine largeur -->
        <div class="main-container">
            <iframe class="webview" 
                    src="https://orco-stream.vercel.app" 
                    allow="fullscreen" 
                    allowfullscreen>
            </iframe>
        </div>

        <!-- Bordure basse -->
        <div class="border-bottom"></div>
    </div>
</body>
</html>
